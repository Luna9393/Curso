<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura limpia con etiquetas semánticas</title>
    <style>
      .tarjeta {
        width: 250px;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      font-family: Arial, sans-serif;
    }

    .tarjeta img {
      width: 100%;
      border-radius: 10px;
    }
    </style>
</head>
<body>

    <header>
        <h1>Mi sitio web</h1>
    </header>

    <main>
       <div class="tarjeta">
        <h2>Noticia 1</h2>
        <p>Contenido de la tarjeta</p>
       </div>
         
       <div class="tarjeta">
        <img src="osopanda.JPG" alt="Imagen de panda">  
        <h2>Panda</h2>
          <p>El panda es un animal adorable que vive en los bosques de bambú.</p>
       </div>
    </main>

    <footer>
        <p>© 2026 Mi sitio web</p>
    </footer>
</body>
</html>
