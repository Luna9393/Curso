<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso del figure y iframe</title>
</head>
<body>
    <figure>
        <img src="osopanda.JPG" alt="Oso panda" width="100" height="150">
        <figcaption>Oso panda en su hábitat natural.</figcaption>
    </figure>

  <iframe 
  width="400" 
  height="225" 
  src="https://www.youtube.com/embed/K_Ia_fDMBEY" 
  title="ASÍ ES JUGAR UNA LIGA MASTER DE VERDAD! APRENDE, EFOOTBALL." 
  frameborder="0" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
  referrerpolicy="strict-origin-when-cross-origin" 
  allowfullscreen></iframe>
</body>
</html>
