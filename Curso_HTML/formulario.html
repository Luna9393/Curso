<!-- <header>: El encabezado. Contiene títulos, logotipos o la introducción de una sección.

<nav>: La navegación de la pagina. Se usa exclusivamente para bloques de enlaces de menú o índices.

<main>: El contenido principal. Solo debe haber uno por página y contiene la información central y única del sitio.

<section>: Una sección genérica. Agrupa contenido relacionado que tiene un tema común (como "Servicios" o "Contacto").

<aside>: Contenido tangencial. Para barras laterales, publicidad o info relacionada que no es vital para el texto principal.

<footer>: El pie de página. Contiene créditos, avisos legales, redes sociales o información de contacto.

<article>: Contenido independiente. Se usa para algo que tiene sentido por sí mismo, como un post de blog, una noticia o un comentario. -->
